# Provider configurations for claude-code-providers-hub
# This file defines available providers and their models

config_version: "1.3"

# Provider definitions
providers:
  # Anthropic Claude (Official)
  claude:
    name: "Anthropic Claude"
    description: "Official Anthropic Claude models"
    base_url: null  # Use default
    config_dir: null  # Use default CLAUDE_HOME
    models:
      default:
        name: "claude-sonnet-4"
        wrapper_name: "claude"
        alias: "cc"
        description: "Default Claude model"
        env:
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-haiku-4"

  # Z.AI GLM Provider
  glm:
    name: "Z.AI GLM"
    description: "Chinese AI models from Z.AI"
    base_url: "https://api.z.ai/api/anthropic"
    config_dir: "~/.claude-glm"
    models:
      # GLM MAX - Maximum power (5.x models, 3x quota multiplier at peak)
      glm-51:
        name: "GLM MAX"
        wrapper_name: "claude-glm"
        alias: "ccg"
        description: "GLM MAX - glm-5.1/glm-5-turbo/glm-4.7 (3x quota)"
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.1"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-5-turbo"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-4.7"
          API_TIMEOUT_MS: "600000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      # GLM STANDARD - Balanced power/cost (mixed 5.x/4.x)
      glm-standard:
        name: "GLM Standard"
        wrapper_name: "claude-glm-standard"
        alias: "ccgs"
        description: "GLM Standard - glm-5-turbo/glm-4.7/glm-4.6 (mixed)"
        config_dir: "~/.claude-glm-standard"
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5-turbo"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-4.7"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-4.6"
          API_TIMEOUT_MS: "600000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      # GLM FAST - Maximum savings (4.x only, always 1x quota)
      glm-fast:
        name: "GLM Fast"
        wrapper_name: "claude-glm-fast"
        alias: "ccf"
        description: "GLM Fast - glm-4.7/glm-4.6/glm-4.5-air (1x always)"
        config_dir: "~/.claude-glm-fast"
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-4.7"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-4.6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-4.5-air"
          API_TIMEOUT_MS: "600000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # MiniMax Provider
  minimax:
    name: "MiniMax"
    description: "Advanced AI models from MiniMax"
    base_url: "https://api.minimax.io/anthropic"
    config_dir: "~/.claude-minimax"
    models:
      default:
        name: "MiniMax-M2"
        wrapper_name: "ccm"
        alias: "ccm"
        description: "MiniMax M2 model"
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: "MiniMax-M2"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "MiniMax-M2"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "MiniMax-M2"
          API_TIMEOUT_MS: "3000000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # DeepSeek Provider
  deepseek:
    name: "DeepSeek"
    description: "Coding-optimized AI from DeepSeek"
    base_url: "https://api.deepseek.com/anthropic"
    config_dir: "~/.claude-deepseek"
    models:
      default:
        name: "deepseek-chat"
        wrapper_name: "ccd"
        alias: "ccd"
        description: "DeepSeek chat model"
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-chat"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-chat"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-chat"
          API_TIMEOUT_MS: "600000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

# Default provider selection
default_provider: "claude"

# User's last selected provider/model (managed by installer)
state:
  last_provider: null
  last_model: null
